name: Build Linux

# 触发：推送到主分支、打 v* 标签，或手动在 Actions 页点 Run workflow。
# 产出 .deb（Ubuntu/Debian 主力交付物）与 .AppImage（通用免安装）；
# 代码 push 到 GitHub 后自动构建，去 Actions 页下载 artifact 即可。
on:
  push:
    branches: [main, master]
    tags: ['v*']
  workflow_dispatch:

env:
  CARGO_TERM_COLOR: always

jobs:
  linux:
    name: Build Linux x64 (deb / appimage)
    runs-on: ubuntu-22.04
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Linux system dependencies
        # Tauri v2 在 Linux 上依赖 webkit2gtk-4.1 / gtk3 / appindicator / rsvg；
        # patchelf 供 appimage 打包重定位；libfuse2 供 appimagetool 运行（AppImage 需要 FUSE）。
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            build-essential curl wget file \
            libssl-dev libgtk-3-dev libayatana-appindicator3-dev \
            libwebkit2gtk-4.1-dev librsvg2-dev patchelf libfuse2

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Install frontend dependencies
        run: npm ci

      - name: Provide 7zz binary for Linux
        # sevenzip_cli::init_bin 在非 Windows 上查找 resource_dir/binaries/7zz
        # （iso/cab/dmg/deb/rpm/xar/cpio/brotli/tar 等只读格式的兜底引擎）。
        # 由 tauri.conf.json 的 resources: ["binaries/"] 一并打进安装包。
        run: |
          sudo apt-get install -y 7zip || sudo apt-get install -y p7zip-full
          mkdir -p src-tauri/binaries
          if command -v 7zz >/dev/null 2>&1; then
            cp "$(command -v 7zz)" src-tauri/binaries/7zz
          else
            cp "$(command -v 7z)" src-tauri/binaries/7zz
          fi
          chmod +x src-tauri/binaries/7zz
          ls -l src-tauri/binaries/

      - name: Build frontend (vite)
        # beforeBuildCommand 在 CI 中以仓库根为 cwd，无法可靠进入其它目录，
        # 故前端构建在此显式于仓库根执行；beforeBuildCommand 只负责编译 bz-cli 二进制。
        run: npm run build

      - name: Build ArkBox for Linux (deb)
        run: npm run tauri build -- --bundles deb

      - name: Build AppImage (optional)
        # AppImage 依赖 appimagetool + FUSE，CI 上偶发失败，故设为可失败，
        # 不影响 .deb 产出（.deb 是 Linux 主力交付物）。
        continue-on-error: true
        run: npm run tauri build -- --bundles appimage

      - name: Upload Linux artifacts
        uses: actions/upload-artifact@v4
        with:
          name: arkbox-linux
          path: |
            src-tauri/target/release/bundle/deb/*.deb
            src-tauri/target/release/bundle/appimage/*.AppImage
          if-no-files-found: warn
